---
# role: timesyncd
# file: molecule/resources/playbooks/prepare.yml

- name: TIMESYNCD | Prepare containers without clock control
  hosts: all
  gather_facts: true
  tasks:
    - name: TIMESYNCD | Refresh Debian package metadata
      become: true
      become_user: root
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.pkg_mgr == 'apt'

    - name: TIMESYNCD | Create the container service override directory
      become: true
      become_user: root
      ansible.builtin.file:
        path: /etc/systemd/system/systemd-timesyncd.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: TIMESYNCD | Permit the real daemon to run without clock privileges
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/systemd/system/systemd-timesyncd.service.d/molecule.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          ConditionCapability=
          ConditionVirtualization=
          [Service]
          AmbientCapabilities=
          CapabilityBoundingSet=
          # No capabilities are needed; avoid retaining SYS_ADMIN for seccomp setup.
          SystemCallFilter=~capset

    - name: TIMESYNCD | Load the test service override
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        daemon_reload: true
