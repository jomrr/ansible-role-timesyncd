---
# role: timesyncd
# file: tasks/main.yml

- name: TIMESYNCD | Load platform packages
  ansible.builtin.include_vars:
    file: "{{ lookup('ansible.builtin.first_found', __timesyncd_platform_files) }}"
  vars:
    __timesyncd_platform_files:
      files:
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: TIMESYNCD | Validate time limits
  ansible.builtin.assert:
    that:
      - timesyncd_root_distance_max_seconds > 0
      - timesyncd_poll_interval_min_sec >= 16
      - timesyncd_poll_interval_max_sec > timesyncd_poll_interval_min_sec
    quiet: true
    fail_msg: Root distance must be positive and polling intervals must satisfy 16 <= minimum < maximum.

- name: TIMESYNCD | Install platform repository packages
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ __timesyncd_repository_package }}"
    state: present
  loop: "{{ __timesyncd_repository_packages }}"
  loop_control:
    loop_var: __timesyncd_repository_package
    label: "{{ __timesyncd_repository_package }}"

- name: TIMESYNCD | Remove conflicting time-service packages
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ __timesyncd_remove_package }}"
    state: absent
  loop: "{{ timesyncd_remove_packages }}"
  loop_control:
    loop_var: __timesyncd_remove_package
    label: "{{ __timesyncd_remove_package }}"

- name: TIMESYNCD | Install the time service and timezone data
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ __timesyncd_packages }}"
    state: present
  notify: reload dbus

- name: TIMESYNCD | Start D-Bus for timezone and time-service management
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: dbus.service
    state: started

- name: TIMESYNCD | Load newly installed D-Bus policies before starting the time service
  ansible.builtin.meta: flush_handlers

- name: TIMESYNCD | Set the system timezone
  become: true
  become_user: root
  community.general.timezone:
    name: "{{ timesyncd_timezone }}"

- name: TIMESYNCD | Configure the time service
  become: true
  become_user: root
  ansible.builtin.template:
    src: etc/systemd/timesyncd.conf.j2
    dest: /etc/systemd/timesyncd.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: restart timesyncd

- name: TIMESYNCD | Enable and start the time service
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    enabled: true
    masked: false
    state: started
